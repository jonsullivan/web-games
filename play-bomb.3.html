
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dangerous Art Playground</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #controls {
    position: fixed;
    top: 10px;
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  button {
    padding: 10px 15px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background: #444;
    color: white;
  }
  #progress-container {
    position: fixed;
    top: 50px;
    width: 300px;
    height: 20px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    z-index: 10;
  }
  #progress-bar {
    height: 100%;
    width: 0%;
    background: limegreen;
    transition: width 0.3s;
  }
  #message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    color: yellow;
    display: none;
    z-index: 20;
    text-align: center;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<div id="controls">
  <button onclick="restartGame()">Restart</button>
</div>
<div id="progress-container">
  <div id="progress-bar"></div>
</div>
<div id="message"></div>
<canvas id="artCanvas"></canvas>

<script>
const canvas = document.getElementById('artCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let shapes = [];
let isDrawing = false;
let uniqueShapeCount = 0;
let gameOver = false;

// Explosion zones
const explosionZones = [];
const EXPLOSION_COUNT = 10;
const WIN_TARGET = 100;

// Audio setup
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];

function playNote() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.3);
}

function playExplosionSound() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(80, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.8);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
  osc.stop(audioCtx.currentTime + 0.8);
}

function randomColor() {
  return `hsl(${Math.random() * 360}, 100%, 50%)`;
}

function createShape(x, y) {
  if (gameOver) return;
  if (checkExplosion(x, y)) {
    triggerExplosion(x, y);
    return;
  }
  if (checkOverlap(x, y)) return;

  const size = Math.random() * 80 + 20;
  const shapeType = Math.floor(Math.random() * 3);
  const rotation = Math.random() * Math.PI * 2;
  shapes.push({
    x, y, size, shapeType, rotation,
    color: randomColor(),
    opacity: 0,
    spinSpeed: (Math.random() - 0.5) * 0.05
  });
  playNote();
  uniqueShapeCount++;
  updateProgress();
  if (uniqueShapeCount >= WIN_TARGET) {
    endGame("🎉 YOU WIN!");
  }
}

function drawShapes() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  shapes.forEach(shape => {
    ctx.save();
    ctx.translate(shape.x, shape.y);
    ctx.rotate(shape.rotation);
    ctx.globalAlpha = shape.opacity;
    ctx.fillStyle = shape.color;
    ctx.beginPath();
    if (shape.shapeType === 0) {
      ctx.arc(0, 0, shape.size / 2, 0, Math.PI * 2);
    } else if (shape.shapeType === 1) {
      ctx.rect(-shape.size / 2, -shape.size / 2, shape.size, shape.size);
    } else {
      ctx.moveTo(0, -shape.size / 2);
      ctx.lineTo(shape.size / 2, shape.size / 2);
      ctx.lineTo(-shape.size / 2, shape.size / 2);
      ctx.closePath();
    }
    ctx.fill();
    ctx.restore();

    if (shape.opacity < 1) shape.opacity += 0.02;
    shape.rotation += shape.spinSpeed;
  });

  if (gameOver) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "red";
    explosionZones.forEach(zone => {
      ctx.beginPath();
      ctx.arc(zone.x, zone.y, zone.radius, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(drawShapes);
}

function checkExplosion(x, y) {
  return explosionZones.some(zone => {
    const dx = x - zone.x;
    const dy = y - zone.y;
    return Math.sqrt(dx * dx + dy * dy) < zone.radius;
  });
}

function checkOverlap(x, y) {
  return shapes.some(shape => {
    const dx = x - shape.x;
    const dy = y - shape.y;
    return Math.sqrt(dx * dx + dy * dy) < shape.size / 2 + 20;
  });
}

function triggerExplosion(x, y) {
  gameOver = true;
  playExplosionSound();
  explosionAnimation(x, y);
  endGame("💥 BOOM! YOU LOSE!");
}

function explosionAnimation(x, y) {
  for (let i = 0; i < 100; i++) {
    shapes.push({
      x: x + (Math.random() - 0.5) * 300,
      y: y + (Math.random() - 0.5) * 300,
      size: Math.random() * 50 + 10,
      shapeType: Math.floor(Math.random() * 3),
      rotation: Math.random() * Math.PI * 2,
      color: `hsl(${Math.random() * 60}, 100%, 50%)`,
      opacity: 1,
      spinSpeed: (Math.random() - 0.5) * 0.2
    });
  }
}

function endGame(message) {
  document.getElementById('message').textContent = message;
  document.getElementById('message').style.display = 'block';
}

function restartGame() {
  shapes = [];
  uniqueShapeCount = 0;
  gameOver = false;
  document.getElementById('message').style.display = 'none';
  updateProgress();
  generateExplosionZones();
}

function generateExplosionZones() {
  explosionZones.length = 0;
  for (let i = 0; i < EXPLOSION_COUNT; i++) {
    explosionZones.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 40 + 30 // Random size bombs
    });
  }
}

function updateProgress() {
  const progress = (uniqueShapeCount / WIN_TARGET) * 100;
  document.getElementById('progress-bar').style.width = progress + "%";
}

canvas.addEventListener('mousedown', () => isDrawing = true);
canvas.addEventListener('mouseup', () => isDrawing = false);
canvas.addEventListener('mousemove', (e) => {
  if (isDrawing) createShape(e.clientX, e.clientY);
});
canvas.addEventListener('click', (e) => {
  createShape(e.clientX, e.clientY);
});

generateExplosionZones();
drawShapes();
</script>

</body>
</html>
