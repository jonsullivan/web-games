<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Platformer with Win & Sound</title>
  <style>
    body { margin: 0; background: #eee; font-family: Arial, sans-serif; }
    canvas { display: block; margin: auto; background: #fff; }
    #gameModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      width: 300px;
    }
    .modal-content h2 { margin-bottom: 20px; }
    .modal-content button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<!-- Modal -->
<div id="gameModal">
  <div class="modal-content">
    <h2 id="modalText"></h2>
    <button id="restartBtn">Restart</button>
  </div>
</div>

<script>
<!-- Sounds -->
canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

// Player
let player = { x: 100, y: 500, w: 40, h: 40, vx: 0, vy: 0, speed: 5, jump: -15, onGround: false };

// Platforms
const platforms = [
  { x: 0, y: 560, w: WIDTH, h: 40 },
  { x: 200, y: 450, w: 200, h: 20 },
  { x: 500, y: 350, w: 200, h: 20 }
];

// Enemies
const enemies = [
  { x: 300, y: 410, w: 40, h: 40, dir: 1, minX: 300, maxX: 400 },
  { x: 550, y: 310, w: 40, h: 40, dir: -1, minX: 500, maxX: 700 }
];

// Goal
const goal = { x: 650, y: 310, w: 30, h: 30 };

const gravity = 1;
const keys = {};
let gameOver = false;

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

function resetGame() {
  player.x = 100;
  player.y = 500;
  player.vx = 0;
  player.vy = 0;
  gameOver = false;
  document.getElementById('gameModal').style.display = 'none';
}

document.getElementById('restartBtn').addEventListener('click', resetGame);

function showModal(message) {
  document.getElementById('modalText').textContent = message;
  document.getElementById('gameModal').style.display = 'flex';
}

function update() {
  if (gameOver) return;

  // Horizontal movement
  if (keys['ArrowLeft']) player.vx = -player.speed;
  else if (keys['ArrowRight']) player.vx = player.speed;
  else player.vx = 0;

  // Jump
  if (keys['ArrowUp'] && player.onGround) {
    player.vy = player.jump;
    player.onGround = false;
    //document.getElementById('jumpSound').play();
  }

  // Apply gravity
  player.vy += gravity;

  // Move player
  player.x += player.vx;
  player.y += player.vy;

  // Collision with platforms
  player.onGround = false;
  for (let plat of platforms) {
    if (player.x < plat.x + plat.w &&
        player.x + player.w > plat.x &&
        player.y < plat.y + plat.h &&
        player.y + player.h > plat.y) {
      if (player.vy > 0) {
        player.y = plat.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  // Enemy movement
  for (let e of enemies) {
    e.x += e.dir * 2;
    if (e.x < e.minX || e.x > e.maxX) e.dir *= -1;
  }

  // Check collision with enemies
  for (let e of enemies) {
    if (player.x < e.x + e.w &&
        player.x + player.w > e.x &&
        player.y < e.y + e.h &&
        player.y + player.h > e.y) {
      gameOver = true;
      //document.getElementById('gameOverSound').play();
      showModal('Game Over!');
    }
  }

  // Check win condition
  if (player.x < goal.x + goal.w &&
      player.x + player.w > goal.x &&
      player.y < goal.y + goal.h &&
      player.y + player.h > goal.y) {
    gameOver = true;
    //document.getElementById('winSound').play();
    showModal('You Win!');
  }
}

function draw() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  // Draw player
  ctx.fillStyle = 'blue';
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Draw platforms
  ctx.fillStyle = 'green';
  for (let plat of platforms) {
    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
  }

  // Draw enemies
  ctx.fillStyle = 'red';
  for (let e of enemies) {
    ctx.fillRect(e.x, e.y, e.w, e.h);
  }

  // Draw goal
  ctx.fillStyle = 'gold';
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
