<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Multi-Level Platformer</title>
<style>
  body { margin: 0; background: #eee; font-family: Arial, sans-serif; }
  canvas { display: block; margin: auto; background: #fff; }
  #gameModal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
  }
  .modal-content {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    width: 300px;
  }
  .modal-content h2 { margin-bottom: 20px; }
  .modal-content button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<!-- Modal -->
<div id="gameModal">
  <div class="modal-content">
    <h2 id="modalText"></h2>
    <button id="restartBtn">Restart</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const WIDTH = canvas.width;
const HEIGHT = canvas.height;

let player = { x: 100, y: 500, w: 40, h: 40, vx: 0, vy: 0, speed: 5, jump: -15, onGround: false };
const gravity = 1;
const keys = {};
let gameOver = false;
let currentLevel = 0;

// Levels data
const levels = [
  {
    bg: '#f0f8ff',
    platforms: [
      { x: 0, y: 560, w: WIDTH, h: 40 },
      { x: 200, y: 450, w: 200, h: 20 },
      { x: 500, y: 350, w: 200, h: 20 }
    ],
    enemies: [
      { x: 300, y: 410, w: 40, h: 40, dir: 1, minX: 300, maxX: 400, speed: 2 }
    ],
    goal: { x: 650, y: 310, w: 40, h: 40 }
  },
  {
    bg: '#ffe4e1',
    platforms: [
      { x: 0, y: 560, w: WIDTH, h: 40 },
      { x: 150, y: 480, w: 150, h: 20 },
      { x: 400, y: 400, w: 150, h: 20 },
      { x: 600, y: 320, w: 150, h: 20 }
    ],
    enemies: [
      { x: 160, y: 440, w: 40, h: 40, dir: 1, minX: 150, maxX: 280, speed: 3 },
      { x: 420, y: 360, w: 40, h: 40, dir: -1, minX: 400, maxX: 550, speed: 3 }
    ],
    goal: { x: 650, y: 280, w: 40, h: 40 }
  },
  {
    bg: '#e6e6fa',
    platforms: [
      { x: 0, y: 560, w: WIDTH, h: 40 },
      { x: 100, y: 500, w: 100, h: 20 },
      { x: 250, y: 430, w: 100, h: 20 },
      { x: 400, y: 360, w: 100, h: 20 },
      { x: 550, y: 290, w: 100, h: 20 }
    ],
    enemies: [
      { x: 110, y: 460, w: 40, h: 40, dir: 1, minX: 100, maxX: 180, speed: 4 },
      { x: 260, y: 390, w: 40, h: 40, dir: -1, minX: 250, maxX: 330, speed: 4 },
      { x: 410, y: 320, w: 40, h: 40, dir: 1, minX: 400, maxX: 480, speed: 4 }
    ],
    goal: { x: 560, y: 250, w: 40, h: 40 }
  }
];

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

function resetGame() {
  player.x = 100;
  player.y = 500;
  player.vx = 0;
  player.vy = 0;
  gameOver = false;
  document.getElementById('gameModal').style.display = 'none';
  if (currentLevel >= levels.length) currentLevel = 0;
}

document.getElementById('restartBtn').addEventListener('click', resetGame);

function showModal(message) {
  document.getElementById('modalText').textContent = message;
  document.getElementById('gameModal').style.display = 'flex';
}

function update() {
  if (gameOver) return;

  const level = levels[currentLevel];

  // Movement
  if (keys['ArrowLeft']) player.vx = -player.speed;
  else if (keys['ArrowRight']) player.vx = player.speed;
  else player.vx = 0;

  if (keys['ArrowUp'] && player.onGround) {
    player.vy = player.jump;
    player.onGround = false;
  }

  player.vy += gravity;
  player.x += player.vx;
  player.y += player.vy;

  // Collision with platforms
  player.onGround = false;
  for (let plat of level.platforms) {
    if (player.x < plat.x + plat.w &&
        player.x + player.w > plat.x &&
        player.y < plat.y + plat.h &&
        player.y + player.h > plat.y) {
      if (player.vy > 0) {
        player.y = plat.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  // Enemy movement
  for (let e of level.enemies) {
    e.x += e.dir * e.speed;
    if (e.x < e.minX || e.x > e.maxX) e.dir *= -1;
  }

  // Collision with enemies
  for (let e of level.enemies) {
    if (player.x < e.x + e.w &&
        player.x + player.w > e.x &&
        player.y < e.y + e.h &&
        player.y + player.h > e.y) {
      gameOver = true;
      showModal('Game Over!');
    }
  }

  // Win condition
  const goal = level.goal;
  if (player.x < goal.x + goal.w &&
      player.x + player.w > goal.x &&
      player.y < goal.y + goal.h &&
      player.y + player.h > goal.y) {
    currentLevel++;
    if (currentLevel < levels.length) {
      showModal('Level Complete! Next Level');
    } else {
      showModal('You Win All Levels!');
    }
    gameOver = true;
  }
}

function draw() {
  const level = levels[currentLevel];
  ctx.fillStyle = level.bg;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Player
  ctx.fillStyle = 'blue';
  ctx.fillRect(player.x, player.y, player.w, player.h);

  // Platforms
  ctx.fillStyle = 'green';
  for (let plat of level.platforms) {
    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
  }

  // Enemies
  ctx.fillStyle = 'red';
  for (let e of level.enemies) {
    ctx.fillRect(e.x, e.y, e.w, e.h);
  }

  // Goal (emoji flag)
  ctx.font = '30px Arial';
  ctx.fillText('🏁', level.goal.x, level.goal.y + 30);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
